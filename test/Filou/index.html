<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Filou">
<meta name="theme-color" content="#1E6E6A">
<title>Filou lit</title>
<link rel="icon" href="icone.png">
<link rel="apple-touch-icon" href="icone.png">
<link rel="stylesheet" href="style.css?v=2t2">
</head>
<body>

<!-- ACCUEIL -->
<section class="ecran" id="ecran-accueil">
  <div class="decor" id="accueil-decor"></div>
  <div class="accueil-centre">
    <h1 class="titre-jeu">Filou <span>lit</span></h1>
    <svg class="filou" role="img" aria-label="Filou le chat"></svg>
    <button class="btn gros or" id="btn-jouer">Jouer</button>
  </div>
</section>

<!-- CARTE DES MONDES -->
<section class="ecran" id="ecran-carte" hidden>
  <div class="decor" id="carte-decor"></div>
  <div class="barre">
    <button class="pastille rouge" id="btn-quitter">👋 Au revoir</button>
    <span class="espace"></span>
    <span class="pastille compteur-croq" title="Croquettes"><span class="nb-croq">0</span><svg class="croq" viewBox="0 0 40 40"><path d="M20 3 C31 3 37 11 36 20 C37 30 30 37 20 37 C9 37 3 29 4 20 C3 10 10 3 20 3 Z" fill="#A8652B"/><path d="M20 8 C28 8 32 13 31 20 C32 27 27 32 20 32 C12 32 8 27 9 20 C8 13 12 8 20 8 Z" fill="#C58447"/><circle cx="15" cy="16" r="2.4" fill="#7E461A"/><circle cx="25" cy="15" r="2.4" fill="#7E461A"/><circle cx="20" cy="24" r="2.4" fill="#7E461A"/></svg></span>
    <button class="pastille" id="btn-maison">🏠 Maison</button>
    <button class="pastille rond btn-parent" id="btn-parent" aria-label="Espace parent (appui long)">⚙️<svg class="anneau" viewBox="0 0 58 58"><circle cx="29" cy="29" r="27"/></svg></button>
  </div>
  <div class="carte-titre" id="carte-titre"></div>
  <div class="carte-zone" id="carte-zone"></div>
  <button class="fleche-monde g" id="monde-prec" aria-label="Monde précédent">◀</button>
  <button class="fleche-monde d" id="monde-suiv" aria-label="Monde suivant">▶</button>
</section>

<!-- EXERCICE -->
<section class="ecran" id="ecran-exo" hidden>
  <div class="decor" id="exo-decor"></div>
  <div class="voile-clair"></div>
  <div class="barre">
    <button class="pastille rond" id="btn-retour-exo" aria-label="Retour à la carte">🗺️</button>
    <span class="espace"></span>
    <div class="progression" id="progression"></div>
    <span class="espace"></span>
    <span class="pastille compteur-croq"><span class="nb-croq">0</span><svg class="croq" viewBox="0 0 40 40"><path d="M20 3 C31 3 37 11 36 20 C37 30 30 37 20 37 C9 37 3 29 4 20 C3 10 10 3 20 3 Z" fill="#A8652B"/><path d="M20 8 C28 8 32 13 31 20 C32 27 27 32 20 32 C12 32 8 27 9 20 C8 13 12 8 20 8 Z" fill="#C58447"/><circle cx="15" cy="16" r="2.4" fill="#7E461A"/><circle cx="25" cy="15" r="2.4" fill="#7E461A"/><circle cx="20" cy="24" r="2.4" fill="#7E461A"/></svg></span>
  </div>
  <main class="table" id="table" aria-live="polite"></main>
</section>

<!-- MAISON DE FILOU -->
<section class="ecran" id="ecran-maison" hidden>
  <div class="decor fond-maison"></div>
  <div class="barre">
    <button class="pastille rond" id="btn-retour-maison" aria-label="Retour à la carte">🗺️</button>
    <span class="pastille titre-maison">La maison de Filou</span>
    <span class="espace"></span>
    <span class="pastille petit" id="maison-compte"></span>
    <span class="pastille compteur-croq"><span class="nb-croq">0</span><svg class="croq" viewBox="0 0 40 40"><path d="M20 3 C31 3 37 11 36 20 C37 30 30 37 20 37 C9 37 3 29 4 20 C3 10 10 3 20 3 Z" fill="#A8652B"/><path d="M20 8 C28 8 32 13 31 20 C32 27 27 32 20 32 C12 32 8 27 9 20 C8 13 12 8 20 8 Z" fill="#C58447"/><circle cx="15" cy="16" r="2.4" fill="#7E461A"/><circle cx="25" cy="15" r="2.4" fill="#7E461A"/><circle cx="20" cy="24" r="2.4" fill="#7E461A"/></svg></span>
  </div>
  <div class="maison">
    <div class="chambre">
      <svg id="chambre-svg" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="La chambre de Filou"></svg>
      <div class="bulle bulle-maison" id="bulle-maison" aria-live="polite"></div>
      <div class="achat" id="achat" hidden></div>
    </div>
    <div class="catalogue">
      <div class="rayons" id="rayons"></div>
      <div class="articles" id="articles"></div>
    </div>
  </div>
</section>

<!-- FILOU QUI GUIDE (carte et exercices) -->
<div class="coin-filou" id="coin" hidden>
  <svg class="filou" role="img" aria-label="Filou"></svg>
  <div class="bulle" id="bulle" aria-live="polite"></div>
</div>

<div class="voile" id="voile-fin" hidden></div>
<section class="ecran parent" id="ecran-parent" hidden></section>

<script src="js/donnees.js?v=2t2"></script>
<script src="js/moteur.js?v=2t2"></script>
<script src="js/dessins.js?v=2t2"></script>
<script src="js/maison.js?v=2t2"></script>
<script src="js/voix.js?v=2t2"></script>
<script src="js/jeux.js?v=2t2"></script>
<script src="js/app.js?v=2t2"></script>
</body>
</html>
